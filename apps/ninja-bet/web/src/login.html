<div class="page page-narrow"
  data-ham-page-config='{ "layout": "default.lhtml" }'
>
  <h1>Log in</h1>
  <form id="login-form" class="card">
    <label>Phone number<input id="phone_number" required /></label>
    <label>Password<input id="password" type="password" required /></label>
    <p id="form-error" class="error" hidden></p>
    <button type="submit" id="submit-btn">Log in</button>
  </form>
  <p class="hint">No account yet? <a href="/register.html">Register</a></p>
</div>
