<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8"/>
  <title>Redirecting to Sportsbook...</title>
  <script>
    // Handle double question mark issue from Ninja redirect (e.g., /play?face=complete?vs_id=...)
    let search = window.location.search;
    if (search.startsWith('?')) {
      const parts = search.substring(1).split('?');
      search = '?' + parts.join('&');
    }
    window.location.replace('../play.html' + search + window.location.hash);
  </script>
</head>
<body style="background: #0B0E14; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
  <p>Loading ninja-bet Sportsbook...</p>


</body></html>
