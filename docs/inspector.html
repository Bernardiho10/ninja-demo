<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Ninja Identity &amp; Biometrics Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./assets/css/shared.css?v=20260921"/>
  
<link rel="stylesheet" href="./assets/css/inspector.css"/>
</head>
<body>
<nav class="navbar-top">
  <div class="nav-brand-group">
    <a href="#" class="brand-link" id="brand-home-link" title="Ninja Identity API Demos">
      <img src="./assets/images/ninja-bet-dark-bg.png" alt="ninja-bet" class="ninja-logo-img" style="height: 30px; width: auto; max-width: 140px; object-fit: contain; display: block;" onerror="this.style.display=&#39;none&#39;; document.getElementById(&#39;brand-fallback&#39;).style.display=&#39;inline-flex&#39;;"/>
      <span id="brand-fallback" style="display:none; font-weight: 900; font-size: 18px; color: #fff; letter-spacing: -0.02em;">
        <span style="color:#10b981;">NINJA</span>·DEMO
      </span>
    </a>
    <span class="nav-env-badge">
      <span class="live-dot-pulse"></span>
      <span>Ninja Sandbox</span>
    </span>

    <!-- Demo Vertical Switcher (All Demos in 1 SPA) -->
    <div class="demo-mode-switcher" id="demo-mode-switcher">
      <button type="button" class="mode-btn active" data-mode="sportsbook" id="mode-btn-sportsbook">
        <span>⚽ Sportsbook KYC</span>
      </button>
      <button type="button" class="mode-btn" data-mode="fintech" id="mode-btn-fintech">
        <span>💳 Digital Banking KYC</span>
      </button>
    </div>
  </div>

  <!-- 3 Simple Steps (Visible on Sportsbook mode) -->
  <div class="checkpoint-stepper" id="checkpoint-stepper">
    <button type="button" class="checkpoint-step active" data-step="1" id="step-nav-1">
      <span class="step-num">1</span>
      <span class="step-label">Sign Up</span>
    </button>
    <div class="step-connector"></div>
    <button type="button" class="checkpoint-step" data-step="2" id="step-nav-2">
      <span class="step-num">2</span>
      <span class="step-label">Add Bank</span>
    </button>
    <div class="step-connector"></div>
    <button type="button" class="checkpoint-step" data-step="3" id="step-nav-3">
      <span class="step-num">3</span>
      <span class="step-label">Withdraw</span>
    </button>
  </div>

  <div class="nav-actions-group">
    <div class="player-identity-card" id="nav-player-pill">
      <div class="player-avatar-icon">👤</div>
      <div class="player-meta-box">
        <div class="player-top-line">
          <span class="player-name" id="nav-player-name">James Bond</span>
          <span class="player-status-badge badge-verified" id="nav-player-status">Step 1</span>
        </div>
        <div class="player-balance-line">
          <span class="balance-label">Wallet:</span>
          <strong class="balance-val" id="nav-player-balance">₦250,000</strong>
        </div>
      </div>
    </div>

    <button type="button" class="btn-reset-ghost" id="global-reset-btn" title="Reset Demo">
      <span class="reset-icon">↺</span>
      <span>Reset</span>
    </button>
  </div>
</nav>

<div class="page">
  <h1>Ninja Call Inspector</h1>
  <p class="lede">
    Every request this app has sent to the Ninja sandbox, and exactly what came back — no mockups, this is the
    real traffic from <code>internal/ninja/client.go</code>&#39;s logger hook.
  </p>
  <button type="button" id="refresh-btn" class="secondary" style="width: auto; padding: 8px 18px; margin-bottom: 18px;">Refresh</button>

  <div id="logs"></div>
</div>

<script type="module" src="./assets/js/nav.js"></script>
<script type="module" src="./assets/js/inspector.js"></script>


</body></html>
